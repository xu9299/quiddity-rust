name: Wire seed workspace retry

on:
  push:
    branches: [validation/wire-seed-workspace-20261114]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wire-seed-workspace-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "6"
  RUST_TEST_THREADS: "6"
  RUSTUP_TOOLCHAIN: "1.99.1"
  QUIDDITY_CORPUS_REQUIRED: "1"
  QUIDDITY_CORPUS: ${{ github.workspace }}/quiddity-corpus
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  review:
    runs-on: macos-15
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: xu9299/quiddity-rust
          ref: 2fdb7c4629c61d6b0445b8d1d6f6e264b2e20a43
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: pzfreo/quiddity-corpus
          ref: 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
          path: quiddity-corpus
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: false
      - name: Record exact source and environment
        run: |
          mkdir -p ../validation-logs/verified
          rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
          { git rev-parse HEAD; git rev-parse HEAD^{tree}; uname -a; sw_vers; rustc -vV; cargo -V; uv --version; } | tee ../validation-logs/environment.log
          test "$(git rev-parse HEAD)" = 2fdb7c4629c61d6b0445b8d1d6f6e264b2e20a43
          test "$(git rev-parse HEAD^{tree})" = 07acb2fb05362578a276530c6d0a408b7403a2d9
          test "$(git -C ../quiddity-corpus rev-parse HEAD)" = 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
          test "$(uname -m)" = arm64
          rustc -vV | grep -Fx 'release: 1.99.1'
          git diff --stat e11b835076624664c057b4a3c1e70dfd18cdc69f HEAD | tee ../validation-logs/scope.log
          git diff --exit-code e11b835076624664c057b4a3c1e70dfd18cdc69f HEAD -- Cargo.toml Cargo.lock crates/haecceity/Cargo.toml tests/fixtures
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: source -> ../target
          shared-key: wire-seed-review-macos-15
      - name: Complete workspace and corpus regression
        if: ${{ !cancelled() }}
        env:
          QUIDDITY_SNAPSHOT_VERIFY_DIR: ${{ github.workspace }}/validation-logs/verified
          RUST_BACKTRACE: full
        run: cargo test --workspace --release --locked 2>&1 | tee ../validation-logs/workspace.log
      - name: Snapshot coverage and provenance
        if: ${{ !cancelled() }}
        run: |
          cargo run -p snapshot-tool --release --locked -- --check --coverage-only --verify-dir ../validation-logs/verified 2>&1 | tee ../validation-logs/coverage.log
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: wire-seed-workspace-retry-evidence
          path: validation-logs/
          retention-days: 30

name: Finite support coverage 0.5.4 validation

on:
  push:
    branches: [validation/planar-cover-pr-main26-20261118]
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [candidate]
        default: candidate

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "6"
  RUST_TEST_THREADS: "6"
  RUST_MIN_STACK: "67108864"
  RUSTUP_TOOLCHAIN: "1.99.1"
  QUIDDITY_CORPUS_REQUIRED: "1"
  QUIDDITY_CORPUS: ${{ github.workspace }}/quiddity-corpus
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  verify:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - kind: candidate
            commit: "65ce13cf090404bc8f530a9ee66a13bc77473a0e"
            tree: "b67eb54a7080eefd927a277dba88dc0116b415db"
    runs-on: macos-26
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        if: github.event_name == 'push' || inputs.target == 'both' || inputs.target == matrix.kind
        with:
          repository: xu9299/quiddity-rust
          ref: ${{ matrix.commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        if: github.event_name == 'push' || inputs.target == 'both' || inputs.target == matrix.kind
        with:
          repository: pzfreo/quiddity-corpus
          ref: 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
          path: quiddity-corpus
          persist-credentials: false
      - name: Record exact source and environment
        if: github.event_name == 'push' || inputs.target == 'both' || inputs.target == matrix.kind
        run: |
          mkdir -p ../validation-logs/verified
          rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
          { git rev-parse HEAD; git rev-parse HEAD^{tree}; uname -a; sw_vers; rustc -vV; cargo -V; } | tee ../validation-logs/environment.log
          test "$(git rev-parse HEAD)" = '${{ matrix.commit }}'
          test "$(git rev-parse HEAD^{tree})" = '${{ matrix.tree }}'
          test "$(git -C ../quiddity-corpus rev-parse HEAD)" = 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
          test "$(uname -m)" = arm64
          rustc -vV | grep -Fx 'release: 1.99.1'
          git diff --stat 847421798ef70f0d6a677999f5b4cb57522819e5 HEAD | tee ../validation-logs/scope.log
          git diff --exit-code 847421798ef70f0d6a677999f5b4cb57522819e5 HEAD -- tests/fixtures
          shasum -a 256 Cargo.toml Cargo.lock crates/haecceity/Cargo.toml | tee ../validation-logs/manifests.log
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: github.event_name == 'push' || inputs.target == 'both' || inputs.target == matrix.kind
        with:
          workspaces: source -> ../target
          shared-key: finite-support-054-macos-26
      - name: Strict baseline on this ARM image
        id: baseline
        run: |
          git checkout --detach '847421798ef70f0d6a677999f5b4cb57522819e5'
          test "$(git rev-parse HEAD^{tree})" = 'ab22e110456f81d40e282f40c804a7c0b395cf30'
          { git rev-parse HEAD; git rev-parse HEAD^{tree}; sw_vers; rustc -vV; } | tee ../validation-logs/baseline-environment.log
          status=0
          cargo run -p snapshot-tool --release --locked -- --check 2>&1 | tee ../validation-logs/baseline.log || status=$?
          git checkout --detach '${{ matrix.commit }}'
          exit "$status"
      - name: Formatting and full workspace lint
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' && matrix.kind == 'candidate' && (github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'candidate') }}
        run: |
          cargo fmt --all --check 2>&1 | tee ../validation-logs/fmt.log
          cargo clippy --workspace --all-targets --release --locked -- -D warnings 2>&1 | tee ../validation-logs/clippy.log
      - name: Strict reproduction of unchanged snapshots
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' && (github.event_name == 'push' || inputs.target == 'both' || inputs.target == matrix.kind) }}
        run: |
          cargo run -p snapshot-tool --release --locked -- --check 2>&1 | tee ../validation-logs/strict.log
          test -z "$(git status --porcelain)"
      - name: Full candidate workspace and corpus regression
        if: ${{ success() && matrix.kind == 'candidate' && (github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'candidate') }}
        env:
          QUIDDITY_SNAPSHOT_VERIFY_DIR: ${{ github.workspace }}/validation-logs/verified
          RUST_BACKTRACE: full
        run: cargo test --workspace --release --locked 2>&1 | tee ../validation-logs/workspace.log
      - name: Snapshot coverage and provenance
        if: ${{ success() && matrix.kind == 'candidate' && (github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'candidate') }}
        run: cargo run -p snapshot-tool --release --locked -- --check --coverage-only --verify-dir ../validation-logs/verified 2>&1 | tee ../validation-logs/coverage.log
      - name: Supported feature-off checks
        if: ${{ success() && matrix.kind == 'candidate' }}
        run: |
          cargo check -p haecceity --release --locked --no-default-features 2>&1 | tee ../validation-logs/feature-off-haecceity.log
          cargo check -p quiddity --release --locked --no-default-features --features presentation 2>&1 | tee ../validation-logs/feature-off-quiddity.log
      - name: Stable public API compatibility
        if: ${{ success() && matrix.kind == 'candidate' }}
        run: |
          cargo install cargo-semver-checks --version 0.51.0 --locked 2>&1 | tee ../validation-logs/semver-install.log
          python3 -m unittest discover -s .github -p test_check_semver.py 2>&1 | tee ../validation-logs/semver-helper.log
          python3 .github/check_semver.py 2>&1 | tee ../validation-logs/semver.log
      - name: Locked dependency advisories
        if: ${{ success() && matrix.kind == 'candidate' }}
        run: |
          cargo install cargo-audit --version 0.22.2 --locked 2>&1 | tee ../validation-logs/audit-install.log
          cargo audit --file Cargo.lock 2>&1 | tee ../validation-logs/audit.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: finite-support-${{ matrix.kind }}-evidence
          path: validation-logs/
          if-no-files-found: ignore
          retention-days: 30

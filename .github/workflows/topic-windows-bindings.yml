name: Windows topic binding validation

on:
  push:
    branches: [validation/topics-windows-bindings-20261111]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.99.1
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_BUILD_JOBS: '4'
  RUST_TEST_THREADS: '4'
  RUST_MIN_STACK: '67108864'
  QUIDDITY_CORPUS: ${{ github.workspace }}/quiddity-corpus
  QUIDDITY_CORPUS_REQUIRED: '1'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  UV_CACHE_DIR: ${{ github.workspace }}/uv-cache

jobs:
  bindings:
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {topic: '234', source: 5d6fd08e4dab6bba4c8592b766968d70a3bd8582, filter: unowned_recess}
          - {topic: '227', source: 81a112caf43597f8f9eb35cc22a47a8c3f0cdc7b, filter: shared_analysis}
          - {topic: combined, source: 7d2a91afd0249cfb5c785cf09a2a982a1c3ba4f0, filter: shared_analysis}
    defaults:
      run:
        shell: pwsh
        working-directory: source
    steps:
      - name: Preserve Git blob line endings
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: xu9299/quiddity-rust
          ref: ${{ matrix.source }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: pzfreo/quiddity-corpus
          ref: 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
          path: quiddity-corpus
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Prepare the pinned interpreter and record the environment
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Join-Path $env:GITHUB_WORKSPACE 'windows-logs'
          New-Item -ItemType Directory -Force -Path $report | Out-Null
          rustup toolchain install 1.99.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          $bindingEnvironment = Join-Path $env:RUNNER_TEMP 'binding-environment'
          uv venv --python 3.14.6 $bindingEnvironment
          if ($LASTEXITCODE -ne 0) { throw 'Python environment creation failed' }
          $python = Join-Path $bindingEnvironment 'Scripts/python.exe'
          uv pip install --python $python pytest==9.1.1
          if ($LASTEXITCODE -ne 0) { throw 'Pytest installation failed' }
          "VALIDATION_PYTHON=$python" >> $env:GITHUB_ENV
          "PYO3_PYTHON=$python" >> $env:GITHUB_ENV
          $source = (git rev-parse HEAD).Trim()
          if ($source -ne '${{ matrix.source }}') { throw 'Unexpected source commit' }
          if ($env:RUNNER_ARCH -ne 'X64') { throw 'Expected a Windows x64 runner' }
          if (git status --porcelain) { throw 'Source checkout is not clean' }
          $corpus = (git -C $env:QUIDDITY_CORPUS rev-parse HEAD).Trim()
          if ($corpus -ne '3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f') { throw 'Unexpected corpus' }
          [ordered]@{
            source = $source
            corpus = $corpus
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            os = [Environment]::OSVersion.VersionString
            rust = (& rustc -vV | Out-String)
            cargo = (& cargo -V)
            python = (& uv run --no-project --python $python python -VV | Out-String)
            pytest = (& uv run --no-project --python $python python -m pytest --version | Out-String)
            uv = (& uv --version)
            build_jobs = $env:CARGO_BUILD_JOBS
            test_threads = $env:RUST_TEST_THREADS
            rust_min_stack = $env:RUST_MIN_STACK
          } | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $report 'environment.json') -Encoding utf8
          uv pip freeze --python $python > (Join-Path $report 'python-packages.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Dependency recording failed' }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: source -> ../target
          key: topic-windows-${{ matrix.topic }}
      - name: Run the directed Rust regression
        run: |
          cargo test --workspace --release --locked --lib '${{ matrix.filter }}' -- --nocapture 2>&1 | Tee-Object ../windows-logs/directed.log
          if ($LASTEXITCODE -ne 0) { throw 'Directed Rust regression failed' }
      - name: Build and stage the native binding without a package build
        run: |
          cargo build -p quiddity-py --release --locked 2>&1 | Tee-Object ../windows-logs/python-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Native binding build failed' }
          $stage = Join-Path $env:RUNNER_TEMP 'binding-stage'
          $package = Join-Path $stage 'quiddity'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Get-ChildItem crates/quiddity-py/python/quiddity -File |
            Where-Object { $_.Extension -in '.py', '.pyi' -or $_.Name -eq 'py.typed' } |
            Copy-Item -Destination $package
          Copy-Item -LiteralPath crates/quiddity-py/python/quiddity/schema -Destination $package -Recurse
          $binary = Join-Path $package '_native.pyd'
          Copy-Item -LiteralPath (Join-Path $env:CARGO_TARGET_DIR 'release/_native.dll') -Destination $binary
          [ordered]@{
            source = '${{ matrix.source }}'
            module = $package
            binary = $binary
            binary_sha256 = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content ../windows-logs/binding.json -Encoding utf8
          "PYTHONPATH=$stage" >> $env:GITHUB_ENV
      - name: Verify the staged binding API
        run: |
          $report = Join-Path $env:GITHUB_WORKSPACE 'windows-logs'
          $binding = Get-Content (Join-Path $report 'binding.json') -Raw | ConvertFrom-Json
          $env:EXPECTED_BINDING = $binding.binary
          uv run --no-project --python $env:VALIDATION_PYTHON python -c 'import os,pathlib,quiddity,quiddity._native; assert pathlib.Path(quiddity._native.__file__).resolve() == pathlib.Path(os.environ["EXPECTED_BINDING"]).resolve(); assert pathlib.Path(quiddity.__file__).resolve().parent == pathlib.Path(os.environ["EXPECTED_BINDING"]).resolve().parent; print(quiddity.__version__, quiddity._native.__file__)' > (Join-Path $report 'import.log')
          if ($LASTEXITCODE -ne 0) { throw 'A different binding was imported' }
          '[pytest]' | Set-Content (Join-Path $report 'pytest.ini') -Encoding utf8
          # The installed-distribution metadata/launcher test belongs to upstream package CI.
          $selection = 'not test_capabilities_version_and_console_script'
          [ordered]@{
            expression = $selection
            excluded = @('test_capabilities_version_and_console_script')
            reason = 'No wheel, distribution metadata or installed console launcher is created in this source-binding check.'
          } | ConvertTo-Json | Set-Content (Join-Path $report 'selection.json') -Encoding utf8
          uv run --no-project --python $env:VALIDATION_PYTHON python -m pytest tests/python -c (Join-Path $report 'pytest.ini') --confcutdir (Get-Location).Path -k $selection -q --basetemp (Join-Path $env:RUNNER_TEMP 'binding-pytest') --junitxml (Join-Path $report 'python-junit.xml') -o "cache_dir=$(Join-Path $env:RUNNER_TEMP 'binding-pytest-cache')" 2>&1 | Tee-Object (Join-Path $report 'python.log')
          $pytestCode = $LASTEXITCODE
          $actualHash = (Get-FileHash -LiteralPath $binding.binary -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $binding.binary_sha256) { throw 'Native binding changed during validation' }
          if ($pytestCode -ne 0) { throw "Binding API tests failed: $pytestCode" }
          if ((git rev-parse HEAD).Trim() -ne '${{ matrix.source }}' -or (git status --porcelain)) { throw 'Source changed during validation' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-${{ matrix.topic }}-binding-evidence
          path: windows-logs/
          retention-days: 30

name: Validate pr2 after the narrow-face fix
permissions:
  contents: read
  actions: read
concurrency:
  group: mesh-b5336ca7-pr2-${{ github.sha }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '6'
  RUST_TEST_THREADS: '6'
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: 1.99.1
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  QUIDDITY_CORPUS_REQUIRED: '1'
  QUIDDITY_CORPUS: ${{ github.workspace }}/corpus
  SOURCE: 56bb56a1fc0d053eaa3df08c8807525842d5a06e
  TREE: ea55d9a0ebd1366d2ddc393fc2ab1012d71bd1aa
jobs:
  reuse-passed-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify and preserve completed checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reused
          gh run view 45631686020 -R xu9299/quiddity-rust --json headSha,jobs,status,conclusion > reused/prior-run.json
          gh run download 45631686020 -R xu9299/quiddity-rust --name mesh-workspace-lint-evidence --dir mesh-workspace-lint-evidence
          gh run download 45631686020 -R xu9299/quiddity-rust --name mesh-compatibility --dir mesh-compatibility
          if ! command -v uv >/dev/null; then pipx install uv; export PATH="$HOME/.local/bin:$PATH"; fi
          uv run --no-project --python 3.13 python - <<'PY'
          import hashlib,json,os,pathlib
          run=json.loads(pathlib.Path('reused/prior-run.json').read_text())
          assert run['headSha']=='22cbfac66ab692d6d81c0e4e0747f869a7bd1a37'
          jobs={j['name']:j for j in run['jobs']}
          assert all(jobs[name]['conclusion']=='success' for name in ('lint','compatibility'))
          expected={"mesh-compatibility/environment.log": "ec548affd5c082933ef550f89522bf94eaca8d7396ac48d22b87a325462c8572", "mesh-compatibility/semver.log": "a42e6da94e857634476ff9c039c4b6cc2d25318b943e7bb5fc0d012e4e192a4a", "mesh-compatibility/wasm-haecceity.log": "d5a255e3b05a5b21037029d9bf7d7966ebb43c408267e424184a94cae45f3405", "mesh-compatibility/wasm-quiddity.log": "bdfc6b4755e16a95bcfd58a47cde3b45c1f46479a0ca3b72c37c008d53ebdf60", "mesh-workspace-lint-evidence/clippy.log": "63ffdde0411311dc284d8590b20067396738c9a3dd4676c4eb8cf2996ef21618", "mesh-workspace-lint-evidence/environment.log": "0861c1b4735c81e8c3775cf0cef97b79a622080effc10094017ec4182ddc3b32", "mesh-workspace-lint-evidence/f3d.log": "d34ba47f05c1a163640b645cc95e9d4c10e8c4611090a2738f59386b75a78ac8", "mesh-workspace-lint-evidence/fmt.log": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855", "mesh-workspace-lint-evidence/mfcadpp-score-tests.log": "0f7e4b97443e54aca647179972594d13bb587afcbf151fab8228148587ea844a", "mesh-workspace-lint-evidence/nist-json-roundtrip.log": "7870751f84ca2e135ed859722d890af1791a9efc443802949640ee360ec047de", "mesh-workspace-lint-evidence/pmi-write-feature-off.log": "1a06a314ea6fb6a19231a6ca26915da790a31df6437d4d71052cba25c2571113", "mesh-workspace-lint-evidence/presentation-feature-off.log": "0ce183ad368d4ba240259aa43ec669b6f1d475a6d6795c5557b544b3228248e9", "mesh-workspace-lint-evidence/score-tests.log": "8d379d39725f95239b0a97dc648a411bfb0be3005348ec44b86d6f415248bf14", "mesh-workspace-lint-evidence/workflow-tests.log": "a06d1bfa024f5b1c858635e51efa2128a52f96e8233d826774425f66a16b149d"}
          for name,digest in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          for folder in ('mesh-workspace-lint-evidence','mesh-compatibility'):
              assert pathlib.Path(folder,'environment.log').read_text().splitlines()[:2]==[os.environ['SOURCE'],os.environ['TREE']]
          pathlib.Path('reused/reuse.json').write_text(json.dumps({'source':os.environ['SOURCE'],'tree':os.environ['TREE'],'run':'https://github.com/xu9299/quiddity-rust/actions/runs/45631686020','reused_jobs':['lint','compatibility'],'files_sha256':expected},indent=2)+chr(10))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mesh-workspace-lint-evidence
          path: mesh-workspace-lint-evidence/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mesh-compatibility
          path: mesh-compatibility/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mesh-reused-evidence
          path: reused/
          if-no-files-found: error
          retention-days: 30
  workspace-all:
    runs-on: macos-26
    timeout-minutes: 355
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/source/target
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ env.SOURCE }}
        path: source
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: pzfreo/quiddity-corpus
        ref: 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
        path: corpus
        persist-credentials: false
    - run: |
        test "$(git rev-parse HEAD^{tree})" = "$TREE"
        test "$(uname -m)" = arm64
        rustup toolchain install 1.99.1 --profile minimal
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: source
        shared-key: selected-mesh-consolidated-arm26
    - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5
      with:
        tool: nextest@0.9.146
    - run: |-
        cargo nextest archive --workspace --release --locked --archive-file ../tests.tar.zst
      id: archive
    - name: Run every workspace case
      if: always() && steps.archive.outcome == 'success'
      run: |
        mkdir -p ../evidence
        test "$(uname -m)" = arm64
        test "$(git rev-parse HEAD)" = "$SOURCE"
        test "$(git rev-parse HEAD^{tree})" = "$TREE"
        echo "$(git rev-parse HEAD) $(git -C ../corpus rev-parse HEAD)" > ../evidence/source.txt
        { uname -a; sw_vers; rustc -vV; } > ../evidence/runner.log
        archive=(--archive-file ../tests.tar.zst --extract-to "$PWD" --extract-overwrite --workspace-remap "$PWD")
        cargo-nextest nextest list "${archive[@]}" --profile ci --message-format json > ../evidence/tests.json
        cargo-nextest nextest run --no-fail-fast --profile ci "${archive[@]}" 2>&1 | tee ../evidence/workspace.log
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: mesh-workspace-all
        path: evidence/
        if-no-files-found: warn
        retention-days: 30
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: mesh-test-binaries
        path: tests.tar.zst
        retention-days: 3
    - name: Select a Python installation with a linkable macOS library
      run: |
        if ! command -v uv >/dev/null; then brew install uv; fi
        uv python install 3.13
        interpreter="$(uv python find --managed-python 3.13)"
        libdir="$(uv run --no-project --python "$interpreter" python -c 'import pathlib, sys; print(next(p.parent for p in pathlib.Path(sys.base_prefix).rglob("libpython3.13.dylib") if p.is_file()))')"
        test -f "$libdir/libpython3.13.dylib"
        echo "PYO3_PYTHON=$interpreter" >> "$GITHUB_ENV"
        echo "LIBRARY_PATH=$libdir" >> "$GITHUB_ENV"
        echo "DYLD_LIBRARY_PATH=$libdir" >> "$GITHUB_ENV"
    - run: |
        mkdir -p ../arm-doc
        { git rev-parse HEAD HEAD^{tree}; git -C ../corpus rev-parse HEAD; uname -a; sw_vers; rustc -vV; } > ../arm-doc/environment.log
        cargo test --doc --workspace --release --locked 2>&1 | tee ../arm-doc/doc.log
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: mesh-arm-doc
        path: arm-doc/
        retention-days: 30
    - name: Reproduce strict snapshots
      if: always()
      run: |
        mkdir -p ../strict-evidence
        test "$(uname -m)" = arm64
        test "$(git rev-parse HEAD)" = "$SOURCE"
        test "$(git rev-parse HEAD^{tree})" = "$TREE"
        { git rev-parse HEAD HEAD^{tree}; git -C ../corpus rev-parse HEAD; uname -a; sw_vers; rustc -vV; } > ../strict-evidence/environment.log
        cargo run -p snapshot-tool --release --locked -- --check 2>&1 | tee ../strict-evidence/strict.log
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: mesh-strict-evidence
        path: strict-evidence/
        if-no-files-found: warn
        retention-days: 30
'on':
  push:
    branches:
    - validation/mesh-b5336ca7-main-pr2-arm26

name: STEP mesh corpus on ARM macOS
on:
  push:
    branches: [validation/step-selected-mesh-corpus]
permissions:
  contents: read
concurrency:
  group: step-selected-mesh-${{ github.sha }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: "6"
  RUST_TEST_THREADS: "3"
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: "1.99.1"
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  QUIDDITY_CORPUS_REQUIRED: "1"
  QUIDDITY_CORPUS: ${{ github.workspace }}/corpus
  SOURCE: 61f2e2e3ad3a300f81d9ed9e742622d658d4e15c
  TREE: 53ce7b702620becd72e81ab28a6867d3b6ebe6ae
jobs:
  mesh-corpus:
    runs-on: macos-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: pzfreo/quiddity-corpus
          ref: 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
          path: corpus
          persist-credentials: false
      - name: Identify source, corpus, OS and compiler
        run: |
          mkdir -p ../evidence
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          rustup toolchain install 1.99.1 --profile minimal
          { git rev-parse HEAD HEAD^{tree}; git -C ../corpus rev-parse HEAD; uname -a; sw_vers; rustc -vV; } | tee ../evidence/environment.log
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: source -> ../target
          shared-key: master-trim-xcode-27
      - name: Run the existing mesh corpus checks and focused regressions
        run: cargo test --release --locked -p haecceity --test mesh -- --nocapture 2>&1 | tee ../evidence/mesh.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: mesh-corpus-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 30


name: NURBS integral contraction 0.5.2 validation

on:
  push:
    branches: [validation/nurbs-integral-052-20261114]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nurbs-integral-052-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "6"
  RUST_TEST_THREADS: "6"
  RUSTUP_TOOLCHAIN: "1.99.1"
  QUIDDITY_CORPUS_REQUIRED: "1"
  QUIDDITY_CORPUS: ${{ github.workspace }}/quiddity-corpus
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Wait for one of the two preceding independent candidates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Do not cancel or rerun either candidate. Waiting is not a full check.
          # The two-candidate limit applies to full validation, not this API poll.
          for attempt in $(seq 1 330); do
            active=0
            for run in 43493706704 43531369173; do
              state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" --jq .status)
              printf '%s run %s: %s\n' "$(date -u +%FT%TZ)" "$run" "$state"
              if [[ "$state" != completed ]]; then active=$((active + 1)); fi
            done
            if (( active < 2 )); then exit 0; fi
            sleep 60
          done
          echo 'No full-validation slot became available within the wait budget.' >&2
          exit 1

  review:
    needs: admission
    runs-on: macos-15
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: xu9299/quiddity-rust
          ref: 184946bc4f0e2924f5c1fc370bcd62baf7387679
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: pzfreo/quiddity-corpus
          ref: 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
          path: quiddity-corpus
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: false
      - name: Record exact source and environment
        run: |
          mkdir -p ../validation-logs/verified
          rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
          { git rev-parse HEAD; git rev-parse HEAD^{tree}; uname -a; sw_vers; rustc -vV; cargo -V; uv --version; } | tee ../validation-logs/environment.log
          test "$(git rev-parse HEAD)" = 184946bc4f0e2924f5c1fc370bcd62baf7387679
          test "$(git rev-parse HEAD^{tree})" = a79eac1be4ae3ce3573ad5ee0c89a4223c202015
          test "$(git -C ../quiddity-corpus rev-parse HEAD)" = 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
          # Reuse the independently completed, identical upstream baseline:
          # https://github.com/xu9299/quiddity-rust/actions/runs/43531369173/job/132249626951
          test "$(sw_vers -productVersion)" = '15.8.2'
          test "$(sw_vers -buildVersion)" = '24H232'
          test "$(uname -m)" = arm64
          rustc -vV | grep -Fx 'release: 1.99.1'
          git diff --stat aacfdc5ca23268ab99de316753269f5364e2e8d3 HEAD | tee ../validation-logs/scope.log
          git diff --exit-code aacfdc5ca23268ab99de316753269f5364e2e8d3 HEAD -- Cargo.toml Cargo.lock crates/haecceity/Cargo.toml tests/fixtures
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: source -> ../target
          shared-key: nurbs-integral-review-macos-15
      - name: Formatting and complete workspace lint
        run: |
          cargo fmt --all --check 2>&1 | tee ../validation-logs/fmt.log
          cargo clippy --workspace --all-targets --release --locked -- -D warnings 2>&1 | tee ../validation-logs/clippy.log
      - name: Supported feature-off builds
        run: |
          cargo check -p haecceity --release --locked --no-default-features 2>&1 | tee ../validation-logs/haecceity-feature-off.log
          cargo check -p quiddity --release --locked --no-default-features --features presentation 2>&1 | tee ../validation-logs/quiddity-feature-off.log
      - name: Reuse unchanged public API and dependency checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The previous candidate passed this step before its deliberate cancellation.
          # This revision changes only the private evaluator, its tests, and prose.
          previous=37a647dea815a5d4125facaae7b6ff8e853547de
          git diff --name-only "$previous" HEAD | sort > ../validation-logs/reused-scope.log
          files=(CHANGELOG.md
                 crates/haecceity/src/nurbs/integral.rs
                 crates/haecceity/src/nurbs/integral/tests.rs
                 docs/nurbs-integration.md)
          printf '%s\n' "${files[@]}" | sort > ../validation-logs/allowed-scope.log
          diff -u ../validation-logs/allowed-scope.log ../validation-logs/reused-scope.log
          endpoint=repos/xu9299/quiddity-rust/actions/jobs/132295200583
          query='.steps[]
            | select(.name == "Public API policy and dependency audit")
            | .conclusion'
          conclusion=$(gh api "$endpoint" --jq "$query")
          test "$conclusion" = success
          summary='Reused passing API policy, semver and Cargo.lock audit:'
          job_url=https://github.com/xu9299/quiddity-rust/actions/runs/43545319693/job/132295200583
          printf '%s\n' "$summary" "$job_url" | tee ../validation-logs/reused-checks.log
      - name: Public synthetic surface-evaluation timing
        env:
          RUST_TEST_THREADS: "1"
          HAECCEITY_THREADS: "1"
        run: |
          timing_args=(-p haecceity --lib --release --locked
            nurbs::integral::tests::benchmark_synthetic_inner_sweeps
            -- --exact --ignored --nocapture)
          cargo test "${timing_args[@]}" 2>&1 | tee ../validation-logs/synthetic-timing.log
      - name: Strict candidate snapshot reproduction
        run: |
          cargo run -p snapshot-tool --release --locked -- --check 2>&1 | tee ../validation-logs/strict.log
          grep -Fx 'HEAD reproduces all 2702 snapshots byte for byte' ../validation-logs/strict.log
          test -z "$(git status --porcelain)"
      - name: Complete workspace and corpus regression
        if: ${{ !cancelled() }}
        env:
          QUIDDITY_SNAPSHOT_VERIFY_DIR: ${{ github.workspace }}/validation-logs/verified
          RUST_BACKTRACE: full
        run: cargo test --workspace --release --locked 2>&1 | tee ../validation-logs/workspace.log
      - name: Snapshot coverage and provenance
        if: ${{ !cancelled() }}
        run: |
          cargo run -p snapshot-tool --release --locked -- --check --coverage-only --verify-dir ../validation-logs/verified 2>&1 | tee ../validation-logs/coverage.log
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nurbs-integral-052-evidence
          path: validation-logs/
          retention-days: 30

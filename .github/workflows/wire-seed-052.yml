name: Wire seed 0.5.2 validation

on:
  push:
    branches: [validation/wire-seed-052-20261114]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wire-seed-052-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "6"
  RUST_TEST_THREADS: "6"
  RUSTUP_TOOLCHAIN: "1.99.1"
  QUIDDITY_CORPUS_REQUIRED: "1"
  QUIDDITY_CORPUS: ${{ github.workspace }}/quiddity-corpus
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  baseline:
    runs-on: macos-15
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: pzfreo/quiddity
          ref: aacfdc5ca23268ab99de316753269f5364e2e8d3
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: pzfreo/quiddity-corpus
          ref: 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
          path: quiddity-corpus
          persist-credentials: false
      - name: Record exact source and environment
        run: |
          mkdir -p ../validation-logs
          rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
          { git rev-parse HEAD; git rev-parse HEAD^{tree}; uname -a; sw_vers; rustc -vV; cargo -V; } | tee ../validation-logs/environment.log
          test "$(git rev-parse HEAD)" = aacfdc5ca23268ab99de316753269f5364e2e8d3
          test "$(git rev-parse HEAD^{tree})" = 10ca6b299d1e6ba22bde97797fd3e8a342f140f3
          test "$(git -C ../quiddity-corpus rev-parse HEAD)" = 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
          test "$(uname -m)" = arm64
          rustc -vV | grep -Fx 'release: 1.99.1'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: source -> ../target
          shared-key: wire-seed-review-macos-15
      - name: Strict reproduction of unchanged upstream snapshots
        run: |
          cargo run -p snapshot-tool --release --locked -- --check 2>&1 | tee ../validation-logs/strict.log
          grep -Fx 'HEAD reproduces all 2702 snapshots byte for byte' ../validation-logs/strict.log
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: wire-seed-052-baseline-evidence
          path: validation-logs/
          retention-days: 30

  review:
    needs: baseline
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        suite: [checks, workspace]
    runs-on: macos-15
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: xu9299/quiddity-rust
          ref: e09653f745deaf843ddb0e73196dd2a8cb61ee6b
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: pzfreo/quiddity-corpus
          ref: 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
          path: quiddity-corpus
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: false
      - name: Record exact source and environment
        run: |
          mkdir -p ../validation-logs/verified
          rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
          { git rev-parse HEAD; git rev-parse HEAD^{tree}; uname -a; sw_vers; rustc -vV; cargo -V; uv --version; } | tee ../validation-logs/environment.log
          test "$(git rev-parse HEAD)" = e09653f745deaf843ddb0e73196dd2a8cb61ee6b
          test "$(git rev-parse HEAD^{tree})" = ca7e5118880374bde71337506e51e2bd7c270ff9
          test "$(git -C ../quiddity-corpus rev-parse HEAD)" = 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
          test "$(uname -m)" = arm64
          rustc -vV | grep -Fx 'release: 1.99.1'
          git diff --stat aacfdc5ca23268ab99de316753269f5364e2e8d3 HEAD | tee ../validation-logs/scope.log
          git diff --exit-code aacfdc5ca23268ab99de316753269f5364e2e8d3 HEAD -- Cargo.toml Cargo.lock crates/haecceity/Cargo.toml tests/fixtures
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: source -> ../target
          shared-key: wire-seed-review-macos-15
      - name: Formatting and complete workspace lint
        if: matrix.suite == 'checks'
        run: |
          cargo fmt --all --check 2>&1 | tee ../validation-logs/fmt.log
          cargo clippy --workspace --all-targets --release --locked -- -D warnings 2>&1 | tee ../validation-logs/clippy.log
      - name: Supported feature-off builds
        if: matrix.suite == 'checks'
        run: |
          cargo check -p haecceity --release --locked --no-default-features 2>&1 | tee ../validation-logs/haecceity-feature-off.log
          cargo check -p quiddity --release --locked --no-default-features --features presentation 2>&1 | tee ../validation-logs/quiddity-feature-off.log
      - name: Public API policy and dependency audit
        if: matrix.suite == 'checks'
        run: |
          cargo install cargo-semver-checks --version 0.51.0 --locked
          uv run --no-project --python 3.14 python -m unittest discover -s .github -p test_check_semver.py 2>&1 | tee ../validation-logs/semver-policy.log
          uv run --no-project --python 3.14 python .github/check_semver.py 2>&1 | tee ../validation-logs/semver.log
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file Cargo.lock 2>&1 | tee ../validation-logs/audit.log
      - name: Strict candidate snapshot reproduction
        if: matrix.suite == 'checks'
        run: |
          cargo run -p snapshot-tool --release --locked -- --check 2>&1 | tee ../validation-logs/strict.log
          grep -Fx 'HEAD reproduces all 2702 snapshots byte for byte' ../validation-logs/strict.log
          test -z "$(git status --porcelain)"
      - name: Complete workspace and corpus regression
        if: ${{ !cancelled() && matrix.suite == 'workspace' }}
        env:
          QUIDDITY_SNAPSHOT_VERIFY_DIR: ${{ github.workspace }}/validation-logs/verified
          RUST_BACKTRACE: full
        run: cargo test --workspace --release --locked 2>&1 | tee ../validation-logs/workspace.log
      - name: Snapshot coverage and provenance
        if: ${{ !cancelled() && matrix.suite == 'workspace' }}
        run: |
          cargo run -p snapshot-tool --release --locked -- --check --coverage-only --verify-dir ../validation-logs/verified 2>&1 | tee ../validation-logs/coverage.log
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: wire-seed-052-${{ matrix.suite }}-evidence
          path: validation-logs/
          retention-days: 30

name: STEP memory dependency validation

on:
  push:
    branches: [validation/step-memory-dependency-20261116]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step-memory-dependency-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "6"
  RUST_TEST_THREADS: "6"
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
      RUSTDOCFLAGS: "-D warnings"
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: xu9299/step-io
          ref: f7932ba7c771f55d039baba302e7af4c8b3eb9b0
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source and environment
        run: |
          mkdir -p ../validation-logs
          rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
          { git rev-parse HEAD; git rev-parse HEAD^{tree}; uname -a; rustc -vV; cargo -V; } | tee ../validation-logs/environment.log
          test "$(git rev-parse HEAD)" = f7932ba7c771f55d039baba302e7af4c8b3eb9b0
          test "$(git rev-parse HEAD^{tree})" = 2202ba3f2a6f6d66db75c9cf827af1a8c88bf312
          git log --format='%H%n%an <%ae>%n%cn <%ce>%n%B' 2d7bd2a9d55fe9a4c8b12e3a8f39bcafe2575300..HEAD | tee ../validation-logs/identity.log
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: source -> ../target
      - name: Complete original CI checks
        run: |
          cargo fmt --all --check 2>&1 | tee ../validation-logs/fmt.log
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee ../validation-logs/clippy.log
          cargo test --workspace --locked 2>&1 | tee ../validation-logs/workspace.log
          cargo doc --no-deps --locked 2>&1 | tee ../validation-logs/doc.log
      - name: Separate synthetic raw-graph memory measurements
        run: |
          cargo build --release --locked --example graph_memory 2>&1 | tee ../validation-logs/example-build.log
          /usr/bin/time -v ../target/release/examples/graph_memory raw 1000000 > ../validation-logs/raw.stdout 2> ../validation-logs/raw.time
          /usr/bin/time -v ../target/release/examples/graph_memory compact 1000000 > ../validation-logs/compact.stdout 2> ../validation-logs/compact.time
          cmp ../validation-logs/raw.stdout ../validation-logs/compact.stdout
          cat ../validation-logs/raw.stdout
          grep 'Maximum resident set size' ../validation-logs/raw.time ../validation-logs/compact.time
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: step-memory-dependency-complete-evidence
          path: validation-logs/
          retention-days: 30

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: "1.85.0"
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: xu9299/step-io
          ref: f7932ba7c771f55d039baba302e7af4c8b3eb9b0
          path: source
          persist-credentials: false
      - name: Verify the declared MSRV
        run: |
          mkdir -p ../validation-logs
          rustup toolchain install 1.85.0 --profile minimal
          { git rev-parse HEAD; git rev-parse HEAD^{tree}; uname -a; rustc -vV; cargo -V; } | tee ../validation-logs/environment.log
          test "$(git rev-parse HEAD)" = f7932ba7c771f55d039baba302e7af4c8b3eb9b0
          test "$(git rev-parse HEAD^{tree})" = 2202ba3f2a6f6d66db75c9cf827af1a8c88bf312
          cargo check --locked -p step-io --all-targets 2>&1 | tee ../validation-logs/msrv.log
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: step-memory-dependency-msrv-evidence
          path: validation-logs/
          retention-days: 30

name: Packed STEP remaining review gates

on:
  push:
    branches: [validation/step-memory-remaining-20261116]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step-memory-remaining-20261116-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "6"
  RUST_TEST_THREADS: "6"
  RUSTUP_TOOLCHAIN: "1.99.1"
  QUIDDITY_CORPUS_REQUIRED: "1"
  QUIDDITY_CORPUS: ${{ github.workspace }}/quiddity-corpus
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  review:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        suite: [checks]
    runs-on: macos-15
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: xu9299/quiddity-rust
          ref: 1792cd365db6b7fe042acf5b7a111884b434252c
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: pzfreo/quiddity-corpus
          ref: 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
          path: quiddity-corpus
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: false
      - name: Record exact source and environment
        run: |
          mkdir -p ../validation-logs/verified
          rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
          { git rev-parse HEAD; git rev-parse HEAD^{tree}; uname -a; sw_vers; rustc -vV; cargo -V; uv --version; } | tee ../validation-logs/environment.log
          test "$(git rev-parse HEAD)" = 1792cd365db6b7fe042acf5b7a111884b434252c
          test "$(git rev-parse HEAD^{tree})" = 0c18eaf19b2441f8dcef340f6fcfe91c90f4bd66
          test "$(git -C ../quiddity-corpus rev-parse HEAD)" = 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
          test "$(uname -m)" = arm64
          git merge-base --is-ancestor 3da4a177eef002b6648f00f46add5a5261fdd77f HEAD
          git log --format='%H%n%an <%ae>%n%cn <%ce>%n%B' 3da4a177eef002b6648f00f46add5a5261fdd77f..HEAD | tee ../validation-logs/identity.log
          rustc -vV | grep -Fx 'release: 1.99.1'
          git diff --stat 3da4a177eef002b6648f00f46add5a5261fdd77f HEAD | tee ../validation-logs/scope.log
          git diff --exit-code 3da4a177eef002b6648f00f46add5a5261fdd77f HEAD -- tests/fixtures
      - name: Prove retained workspace and lint coverage still applies
        run: |
          git diff --exit-code 246a6c8291e5429199f17d9311e9fda81ea96cc7 HEAD -- src crates/haecceity/src crates/quiddity-py/src tests crates/haecceity/schema Cargo.lock .github
          git diff 246a6c8291e5429199f17d9311e9fda81ea96cc7 HEAD -- Cargo.toml crates/haecceity/Cargo.toml crates/haecceity/docs/step-provenance-memory.md | tee ../validation-logs/dependency-scope.log
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: source -> ../target
          shared-key: step-memory-review-macos-15
      - name: Public API policy and dependency audit
        if: matrix.suite == 'checks'
        run: |
          cargo install cargo-semver-checks --version 0.51.0 --locked
          uv run --no-project --python 3.14 python -m unittest discover -s .github -p test_check_semver.py 2>&1 | tee ../validation-logs/semver-policy.log
          uv run --no-project --python 3.14 python .github/check_semver.py 2>&1 | tee ../validation-logs/semver.log
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file Cargo.lock 2>&1 | tee ../validation-logs/audit.log
      - name: Verify the pinned packed-graph dependency
        run: |
          cargo tree --locked -i step-io 2>&1 | tee ../validation-logs/dependency.log
          grep -F "2800c9ab" ../validation-logs/dependency.log
      - name: Strict candidate snapshot reproduction
        if: matrix.suite == 'checks'
        run: |
          cargo run -p snapshot-tool --release --locked -- --check 2>&1 | tee ../validation-logs/strict.log
          grep -E '^HEAD reproduces all [0-9]+ snapshots byte for byte$' ../validation-logs/strict.log
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: step-memory-remaining-20261116-${{ matrix.suite }}-evidence
          path: validation-logs/
          retention-days: 30

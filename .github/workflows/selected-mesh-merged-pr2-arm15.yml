name: Merged selected mesh pr2 regression
on:
  push:
    branches: [validation/selected-mesh-merged-pr2-arm15-20261123]
permissions:
  contents: read
  actions: read
concurrency:
  group: selected-mesh-merged-pr2-arm15-${{ github.sha }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: "6"
  RUST_TEST_THREADS: "6"
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: "1.99.1"
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  QUIDDITY_CORPUS_REQUIRED: "1"
  QUIDDITY_CORPUS: ${{ github.workspace }}/corpus
  SOURCE: f0aa28a5798254b6017f5bd86444cee8c1b3a3ba
  TREE: 2004f694250feed57db79aa65ee97f0671362cb8
jobs:
  strict:
    runs-on: macos-15
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: pzfreo/quiddity-corpus
          ref: 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
          path: corpus
          persist-credentials: false
      - name: Identify source, corpus, OS and compiler
        run: |
          mkdir -p ../evidence
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          rustup toolchain install 1.99.1 --profile minimal
          { git rev-parse HEAD HEAD^{tree}; git -C ../corpus rev-parse HEAD; uname -a; sw_vers; rustc -vV; } | tee ../evidence/environment.log
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: source -> ../target
          shared-key: selected-mesh-strict-arm15
      - name: Reproduce the committed snapshots
        run: cargo run -p snapshot-tool --release --locked -- --check 2>&1 | tee ../evidence/strict.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: mesh-strict-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 30

  build-tests:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/source/target
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: pzfreo/quiddity-corpus
          ref: 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
          path: corpus
          persist-credentials: false
      - run: |
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test "$(uname -m)" = arm64
          rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: source
          shared-key: selected-mesh-nextest-arm15
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5
        with:
          tool: nextest@0.9.146
      - run: cargo nextest archive --workspace --release --locked --archive-file ../tests.tar.zst
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mesh-test-binaries
          path: tests.tar.zst
          retention-days: 3
      - name: Select a Python installation with a linkable macOS library
        run: |
          if ! command -v uv >/dev/null; then brew install uv; fi
          uv python install 3.13
          interpreter="$(uv python find --managed-python 3.13)"
          libdir="$(uv run --no-project --python "$interpreter" python -c 'import pathlib, sys; print(next(p.parent for p in pathlib.Path(sys.base_prefix).rglob("libpython3.13.dylib") if p.is_file()))')"
          test -f "$libdir/libpython3.13.dylib"
          echo "PYO3_PYTHON=$interpreter" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$libdir" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$libdir" >> "$GITHUB_ENV"
      - run: |
          mkdir -p ../arm-doc
          { git rev-parse HEAD HEAD^{tree}; git -C ../corpus rev-parse HEAD; uname -a; sw_vers; rustc -vV; } > ../arm-doc/environment.log
          cargo test --doc --workspace --release --locked 2>&1 | tee ../arm-doc/doc.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: mesh-arm-doc
          path: arm-doc/
          retention-days: 30

  workspace-shard:
    needs: build-tests
    runs-on: macos-15
    timeout-minutes: 355
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: pzfreo/quiddity-corpus
          ref: 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
          path: corpus
          persist-credentials: false
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5
        with:
          tool: nextest@0.9.146
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: mesh-test-binaries
      - name: Test the assigned workspace cases
        run: |
          mkdir -p ../evidence
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          if ! command -v uv >/dev/null; then if [ "$(uname -s)" = Darwin ]; then brew install uv; else pipx install uv; export PATH="$HOME/.local/bin:$PATH"; fi; fi
          echo "$(git rev-parse HEAD) $(git -C ../corpus rev-parse HEAD)" > ../evidence/source.txt
          archive=(--archive-file ../tests.tar.zst --extract-to "$PWD" --extract-overwrite --workspace-remap "$PWD")
          cargo-nextest nextest list "${archive[@]}" --profile ci --message-format json > ../evidence/tests.json
          uv run --no-project --python 3.13 .github/shards.py ../evidence/tests.json .config/test-times.json macOS ${{ matrix.shard }} 4 > ../evidence/shard.filter
          cargo-nextest nextest run --no-fail-fast --profile ci "${archive[@]}" -E "$(cat ../evidence/shard.filter)" 2>&1 | tee ../evidence/workspace.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: mesh-workspace-${{ matrix.shard }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30


  reuse-passed-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify and preserve completed checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reused
          gh run view 45182956233 -R xu9299/quiddity-rust --json headSha,jobs,status,conclusion > reused/prior-run.json
          gh run download 45182956233 -R xu9299/quiddity-rust --name mesh-workspace-lint-evidence --dir mesh-workspace-lint-evidence
          gh run download 45182956233 -R xu9299/quiddity-rust --name mesh-compatibility --dir mesh-compatibility
          if ! command -v uv >/dev/null; then pipx install uv; export PATH="$HOME/.local/bin:$PATH"; fi
          uv run --no-project --python 3.13 python - <<'PY'
          import hashlib,json,os,pathlib
          run=json.loads(pathlib.Path('reused/prior-run.json').read_text())
          assert run['headSha']=='7b5076decf13510aa1ef2b892f8cba941eaa35c9'
          jobs={j['name']:j for j in run['jobs']}
          assert all(jobs[name]['conclusion']=='success' for name in ('lint','compatibility'))
          expected={"mesh-compatibility/environment.log": "f27db1de33f300bccdba2569e0ae1e703974f49d0919e574a9432da1fd8d8dbc", "mesh-compatibility/semver.log": "ec94fca65391bd272e88843e7f9f5f9ce8795b3bf2399104bec17593001cb689", "mesh-compatibility/wasm-haecceity.log": "a415751fcc8045c6ec0ff3755a6cc8a7f1ffe856c14b5e2f85053b32c105efd7", "mesh-compatibility/wasm-quiddity.log": "54750413416e33b307d698bfe80b8cbe10cf066115584d8ad84b2db17084930f", "mesh-workspace-lint-evidence/clippy.log": "4ff9a785ecefebc92260a216c5858bfd58fd557c7ebea87611be7d3534db6ae4", "mesh-workspace-lint-evidence/environment.log": "07e19a403fd90033848dd437ab00c9097a2732bb0553fb3e31d5a5c4469dcf2c", "mesh-workspace-lint-evidence/f3d.log": "057fb049b2b91970b80d7bf1a6981bcec9e947d19d26cf0b601e880ca681f403", "mesh-workspace-lint-evidence/fmt.log": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855", "mesh-workspace-lint-evidence/mfcadpp-score-tests.log": "2d014bb427120fb1a5014d7499096989061fd0fdf40acb471c2e2667de60e71e", "mesh-workspace-lint-evidence/nist-json-roundtrip.log": "16f716a929e7d2b240804139566ed24d94ac6fd85ac4f366303ecd5de0d7efbf", "mesh-workspace-lint-evidence/pmi-write-feature-off.log": "0195dbd7741ec7a70f203e58e80277fc089377d905173dbb05bf64fccc891f49", "mesh-workspace-lint-evidence/presentation-feature-off.log": "227d15df64c27fe2244be95d29d74d1a43d67898d0854f9a1bcec7e6fe55e09c", "mesh-workspace-lint-evidence/score-tests.log": "42d7c170baf412c0a64b91405f0bca0d5cf3c27303acf62deadb60967b867ca7", "mesh-workspace-lint-evidence/workflow-tests.log": "5e3f3b6f7097c9238aff51373ab02251b5297ec19280ae2e36a3295d09741fd3"}
          for name,digest in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          for folder in ('mesh-workspace-lint-evidence','mesh-compatibility'):
              assert pathlib.Path(folder,'environment.log').read_text().splitlines()[:2]==[os.environ['SOURCE'],os.environ['TREE']]
          pathlib.Path('reused/reuse.json').write_text(json.dumps({'source':os.environ['SOURCE'],'tree':os.environ['TREE'],'run':'https://github.com/xu9299/quiddity-rust/actions/runs/45182956233','reused_jobs':['lint','compatibility'],'files_sha256':expected},indent=2)+chr(10))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mesh-workspace-lint-evidence
          path: mesh-workspace-lint-evidence/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mesh-compatibility
          path: mesh-compatibility/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mesh-reused-evidence
          path: reused/
          if-no-files-found: error
          retention-days: 30

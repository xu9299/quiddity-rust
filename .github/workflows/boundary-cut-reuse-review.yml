name: Spline boundary cut reuse full ARM workspace

on:
  push:
    branches: [validation/spline-boundary-cuts-workspace-xcode-27-20261118]

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "6"
  RUST_TEST_THREADS: "6"
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: "1.99.1"
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  QUIDDITY_CORPUS_REQUIRED: "1"
  QUIDDITY_CORPUS: ${{ github.workspace }}/quiddity-corpus

jobs:
  workspace:
    runs-on: xcode-27
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 'c29813096e62141eaad9b181af4bfe7db4c1671c'
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: pzfreo/quiddity-corpus
          ref: 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
          path: quiddity-corpus
          persist-credentials: false
      - name: Record exact source, corpus, and compiler
        run: |
          mkdir -p ../validation-logs/verified
          rustup toolchain install 1.99.1 --profile minimal
          { git rev-parse HEAD; git rev-parse HEAD^{tree}; git -C ../quiddity-corpus rev-parse HEAD; uname -a; sw_vers; rustc -vV; cargo -V; } | tee ../validation-logs/environment.log
          test "$(git rev-parse HEAD)" = 'c29813096e62141eaad9b181af4bfe7db4c1671c'
          test "$(git rev-parse HEAD^{tree})" = '7991b1297a02df904753c708e94f7b936313c73e'
          test "$(git -C ../quiddity-corpus rev-parse HEAD)" = 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
          test "$(uname -m)" = arm64
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: source -> ../target
          shared-key: boundary-cut-reuse-xcode-27
      - name: Complete workspace and public corpus
        env:
          QUIDDITY_SNAPSHOT_VERIFY_DIR: ${{ github.workspace }}/validation-logs/verified
        run: cargo test --workspace --release --locked 2>&1 | tee ../validation-logs/workspace.log
      - name: Snapshot coverage and provenance
        run: cargo run -p snapshot-tool --release --locked -- --check --coverage-only --verify-dir ../validation-logs/verified 2>&1 | tee ../validation-logs/coverage.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: boundary-cut-reuse-evidence
          path: validation-logs/
          if-no-files-found: ignore
          retention-days: 30

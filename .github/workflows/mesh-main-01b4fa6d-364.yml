name: Mesh PR 364 against main 01b4fa6d
permissions:
  contents: read
  actions: read
concurrency:
  group: mesh-main-01b4fa6d-364-${{ github.sha }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '6'
  RUST_TEST_THREADS: '6'
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: 1.99.1
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  QUIDDITY_CORPUS_REQUIRED: '1'
  QUIDDITY_CORPUS: ${{ github.workspace }}/corpus
  SOURCE: 190fd5dbf5f01e4a665a5a49ccd9d88bb5bde547
  TREE: 5d87f8abb08eb6f50c6e3965933f8e3fd9e04b77
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ env.SOURCE }}
        path: source
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: pzfreo/quiddity-corpus
        ref: 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
        path: corpus
        persist-credentials: false
    - name: Identify source and compiler
      run: |
        mkdir -p ../evidence
        test "$(git rev-parse HEAD)" = "$SOURCE"
        test "$(git rev-parse HEAD^{tree})" = "$TREE"
        rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
        { git rev-parse HEAD HEAD^{tree}; git -C ../corpus rev-parse HEAD; uname -a; rustc -vV; } | tee ../evidence/environment.log
        if ! command -v uv >/dev/null; then pipx install uv; echo "$HOME/.local/bin" >> "$GITHUB_PATH"; fi
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: source -> ../target
        shared-key: selected-mesh-cost-lint
    - name: Check workflow helper tests
      run: |
        uv run --no-project --python 3.13 python -m unittest discover -s .github -p 'test_*.py' 2>&1 | tee ../evidence/workflow-tests.log
        uv run --no-project --python 3.13 python -I tools/as_compare/test_score.py 2>&1 | tee ../evidence/score-tests.log
        uv run --no-project --python 3.13 python -I tools/as_compare/test_score_mfcadpp.py 2>&1 | tee ../evidence/mfcadpp-score-tests.log
    - name: Check published crate dependency requirements
      run: uv run --no-project --python 3.13 python .github/check_public_deps.py 2>&1 | tee ../evidence/public-deps.log
    - name: Check formatting and workspace Clippy
      run: |
        cargo fmt --all --check 2>&1 | tee ../evidence/fmt.log
        cargo clippy --workspace --all-targets --release --locked -- -D warnings 2>&1 | tee ../evidence/clippy.log
    - name: Check supported feature configurations
      run: |
        cargo check --workspace --all-targets --release --locked --features f3d 2>&1 | tee ../evidence/f3d.log
        cargo test -p haecceity --release --locked --no-default-features --test pmi_write 2>&1 | tee ../evidence/pmi-write-feature-off.log
        cargo check -p quiddity --release --locked --no-default-features --features presentation 2>&1 | tee ../evidence/presentation-feature-off.log
        cargo test -p haecceity --release --locked --features json-import --test pmi_json_roundtrip nist_roundtrip -- --exact 2>&1 | tee ../evidence/nist-json-roundtrip.log
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: mesh-workspace-lint-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 30
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ env.SOURCE }}
        path: source
        persist-credentials: false
    - name: Identify source and compiler
      run: |
        mkdir -p ../compatibility
        test "$(git rev-parse HEAD)" = "$SOURCE"
        test "$(git rev-parse HEAD^{tree})" = "$TREE"
        rustup toolchain install 1.99.1 --profile minimal
        { git rev-parse HEAD HEAD^{tree}; rustc -vV; } > ../compatibility/environment.log
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: source -> ../target
        shared-key: selected-mesh-merged-compatibility
    - name: Check the supported WebAssembly build
      run: |
        rustup target add wasm32-unknown-unknown
        cargo build -p haecceity --release --locked --target wasm32-unknown-unknown --no-default-features --features presentation,json 2>&1 | tee ../compatibility/wasm-haecceity.log
        cargo build -p quiddity --lib --release --locked --target wasm32-unknown-unknown --no-default-features --features presentation,json 2>&1 | tee ../compatibility/wasm-quiddity.log
    - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5
      with:
        tool: cargo-semver-checks@0.51.0
    - name: Check the public API
      run: |
        if ! command -v uv >/dev/null; then pipx install uv; export PATH="$HOME/.local/bin:$PATH"; fi
        uv run --no-project --python 3.13 python .github/check_semver.py 2>&1 | tee ../compatibility/semver.log
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: mesh-compatibility
        path: compatibility/
        if-no-files-found: error
        retention-days: 30
  workspace-all:
    runs-on: macos-26
    timeout-minutes: 355
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/source/target
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ env.SOURCE }}
        path: source
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: pzfreo/quiddity-corpus
        ref: 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
        path: corpus
        persist-credentials: false
    - run: |
        test "$(git rev-parse HEAD^{tree})" = "$TREE"
        test "$(uname -m)" = arm64
        rustup toolchain install 1.99.1 --profile minimal
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: source
        shared-key: selected-mesh-consolidated-arm26
    - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5
      with:
        tool: nextest@0.9.146
    - run: |-
        cargo nextest archive --workspace --release --locked --archive-file ../tests.tar.zst
      id: archive
    - name: Run every workspace case
      if: always() && steps.archive.outcome == 'success'
      run: |
        mkdir -p ../evidence
        test "$(uname -m)" = arm64
        test "$(git rev-parse HEAD)" = "$SOURCE"
        test "$(git rev-parse HEAD^{tree})" = "$TREE"
        echo "$(git rev-parse HEAD) $(git -C ../corpus rev-parse HEAD)" > ../evidence/source.txt
        { uname -a; sw_vers; rustc -vV; } > ../evidence/runner.log
        archive=(--archive-file ../tests.tar.zst --extract-to "$PWD" --extract-overwrite --workspace-remap "$PWD")
        cargo-nextest nextest list "${archive[@]}" --profile ci --message-format json > ../evidence/tests.json
        QUIDDITY_SNAPSHOT_VERIFY_DIR="$GITHUB_WORKSPACE/emitted/candidate" cargo-nextest nextest run --no-fail-fast --profile ci "${archive[@]}" 2>&1 | tee ../evidence/workspace.log
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: mesh-workspace-all
        path: evidence/
        if-no-files-found: warn
        retention-days: 30
    - name: Select a Python installation with a linkable macOS library
      id: python-doc
      if: always() && steps.archive.outcome == 'success'
      run: |
        if ! command -v uv >/dev/null; then brew install uv; fi
        uv python install 3.13
        interpreter="$(uv python find --managed-python 3.13)"
        libdir="$(uv run --no-project --python "$interpreter" python -c 'import pathlib, sys; print(next(p.parent for p in pathlib.Path(sys.base_prefix).rglob("libpython3.13.dylib") if p.is_file()))')"
        test -f "$libdir/libpython3.13.dylib"
        echo "PYO3_PYTHON=$interpreter" >> "$GITHUB_ENV"
        echo "LIBRARY_PATH=$libdir" >> "$GITHUB_ENV"
        echo "DYLD_LIBRARY_PATH=$libdir" >> "$GITHUB_ENV"
    - name: Run all workspace doctests
      if: always() && steps.python-doc.outcome == 'success'
      run: |
        mkdir -p ../arm-doc
        { git rev-parse HEAD HEAD^{tree}; git -C ../corpus rev-parse HEAD; uname -a; sw_vers; rustc -vV; } > ../arm-doc/environment.log
        cargo test --doc --workspace --release --locked 2>&1 | tee ../arm-doc/doc.log
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: mesh-arm-doc
        path: arm-doc/
        retention-days: 30
    - name: Reproduce strict snapshots
      id: strict
      if: always()
      run: |
        mkdir -p ../strict-evidence
        test "$(uname -m)" = arm64
        test "$(git rev-parse HEAD)" = "$SOURCE"
        test "$(git rev-parse HEAD^{tree})" = "$TREE"
        { git rev-parse HEAD HEAD^{tree}; git -C ../corpus rev-parse HEAD; uname -a; sw_vers; rustc -vV; } > ../strict-evidence/environment.log
        cargo run -p snapshot-tool --release --locked -- --check 2>&1 | tee ../strict-evidence/strict.log
    - name: Compare changed snapshots to the direct parent on this runner
      if: always() && steps.strict.outcome == 'failure'
      run: |
        uv run --no-project --python 3.13 python - f68fe10e2b6e79178a03dc44b7a920d3b9987d98 $SOURCE 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f <<'PY'
        """Compare the strict byte differences to the direct control on the same ARM runner."""
        import hashlib
        import json
        import os
        import re
        import subprocess
        import sys
        from pathlib import Path
        
        parent, source, corpus = sys.argv[1:]
        root = Path.cwd()
        out = root.parent / "strict-evidence"
        emitted = root.parent / "emitted"
        committed = root / "tests/fixtures/rust-snapshot"
        
        
        def git(*args):
            return subprocess.check_output(["git", *args], text=True).strip()
        
        
        def checksums(folder):
            return {f.relative_to(folder).as_posix(): hashlib.sha256(f.read_bytes()).hexdigest()
                    for f in sorted(folder.rglob("*.json.gz"))}
        
        
        def differences(left, right):
            return sorted(k for k in (left.keys() | right.keys()) if left.get(k) != right.get(k))
        
        
        assert git("rev-parse", "HEAD") == source
        assert git("-C", os.environ["QUIDDITY_CORPUS"], "rev-parse", "HEAD") == corpus
        logged = (out / "strict.log").read_text().replace(r'\"', '"')
        match = re.search(r"Rust snapshot differs: missing=(\[.*?\]), added=(\[.*?\]), changed=(\[.*?\])", logged)
        if not match:
            raise RuntimeError("Inspect strict.log for a producer or provenance error")
        missing, added, changed = [json.loads(group) for group in match.groups()]
        reference = checksums(committed)
        assert reference == json.loads((committed / "provenance.json").read_bytes())["snapshots"]
        candidate = checksums(emitted / "candidate")
        assert set(missing) == reference.keys() - candidate.keys()
        assert set(added) == candidate.keys() - reference.keys()
        assert set(changed) == {k for k in candidate.keys() & reference.keys() if candidate[k] != reference[k]}
        assert missing or added or changed
        # Effective surfaces have one independently replayable producer. For any other
        # difference replay all snapshot producers, without repeating the workspace run.
        effective_only = all(k.startswith("effective_surfaces/") for k in missing + added + changed)
        subprocess.run(["git", "checkout", "--quiet", "--detach", parent], check=True)
        assert git("rev-parse", "HEAD") == parent
        assert checksums(committed) == reference
        if effective_only:
            args = ["-p", "quiddity", "--lib", "regression_tests::effective_surfaces::rust_snapshot_effective_surfaces", "--", "--exact", "--nocapture"]
        else:
            args = ["--workspace", "rust_snapshot", "--", "--nocapture"]
        with (out / "parent.log").open("w") as log:
            subprocess.run(["cargo", "test", "--release", "--locked", *args], env=dict(
                os.environ, QUIDDITY_SNAPSHOT_VERIFY_DIR=str(emitted / "parent")),
                stdout=log, stderr=subprocess.STDOUT, check=True)
        control = checksums(emitted / "parent")
        if effective_only:
            candidate = {k: v for k, v in candidate.items() if k.startswith("effective_surfaces/")}
            reference = {k: v for k, v in reference.items() if k.startswith("effective_surfaces/")}
        assert control and candidate
        delta = differences(candidate, control)
        base_delta = differences(control, reference)
        records = {k: {"candidate": candidate.get(k), "parent": control.get(k), "committed": reference.get(k)}
                   for k in sorted(set(delta + base_delta + changed + added + missing))}
        result = dict(source=source, parent=parent, corpus=corpus, scope="effective_surfaces" if effective_only else "all",
                      candidate_count=len(candidate), parent_count=len(control), committed_count=len(reference),
                      different_from_parent=delta, parent_differs_from_committed=base_delta, hashes=records)
        (out / "parent-control.json").write_text(json.dumps(result, indent=2) + "\n")
        print(f"Compared {len(candidate)} snapshot files. Differences from parent: {len(delta)}. Parent versus committed: {len(base_delta)}.")
        if delta:
            sys.exit("The candidate differs from its direct control")
        PY
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: mesh-strict-evidence
        path: strict-evidence/
        if-no-files-found: warn
        retention-days: 30
'on':
  push:
    branches:
    - validation/mesh-stack-main-364-190fd5db

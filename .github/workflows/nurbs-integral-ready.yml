name: NURBS integral final strict review

on:
  push:
    branches: [validation/nurbs-integral-ready-052-20261115]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nurbs-integral-ready-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "6"
  RUST_TEST_THREADS: "6"
  RUSTUP_TOOLCHAIN: "1.99.1"
  QUIDDITY_CORPUS_REQUIRED: "1"
  QUIDDITY_CORPUS: ${{ github.workspace }}/quiddity-corpus
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  review:
    runs-on: macos-15
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: xu9299/quiddity-rust
          ref: c294e9b1f5ab93b68b8c26a319ccf299889ed000
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: pzfreo/quiddity-corpus
          ref: 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
          path: quiddity-corpus
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: false
      - name: Record exact source and environment
        run: |
          mkdir -p ../validation-logs/verified
          rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
          { git rev-parse HEAD; git rev-parse HEAD^{tree}; uname -a; sw_vers; rustc -vV; cargo -V; uv --version; } | tee ../validation-logs/environment.log
          test "$(git rev-parse HEAD)" = c294e9b1f5ab93b68b8c26a319ccf299889ed000
          test "$(git rev-parse HEAD^{tree})" = b1e44c5538b579c823decc100bb33d9cfe67567f
          test "$(git -C ../quiddity-corpus rev-parse HEAD)" = 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
          # Reuse the independently completed, identical upstream baseline:
          # https://github.com/xu9299/quiddity-rust/actions/runs/43531369173/job/132249626951
          test "$(sw_vers -productVersion)" = '15.8.2'
          test "$(sw_vers -buildVersion)" = '24H232'
          test "$(uname -m)" = arm64
          rustc -vV | grep -Fx 'release: 1.99.1'
          git diff --stat aacfdc5ca23268ab99de316753269f5364e2e8d3 HEAD | tee ../validation-logs/scope.log
          # Geometry and reference bands are identical to the independently checked producer.
          git diff --exit-code 184946bc4f0e2924f5c1fc370bcd62baf7387679 HEAD -- Cargo.toml Cargo.lock crates/haecceity src tests ':!tests/fixtures/rust-snapshot'
          cargo run -p snapshot-tool --release --locked -- --diff aacfdc5ca23268ab99de316753269f5364e2e8d3 > ../validation-logs/expectation-diff.log
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: source -> ../target
          shared-key: nurbs-integral-review-macos-15
      - name: Formatting and complete workspace lint
        run: |
          cargo fmt --all --check 2>&1 | tee ../validation-logs/fmt.log
          cargo clippy --workspace --all-targets --release --locked -- -D warnings 2>&1 | tee ../validation-logs/clippy.log
      - name: Supported feature-off builds
        run: |
          cargo check -p haecceity --release --locked --no-default-features 2>&1 | tee ../validation-logs/haecceity-feature-off.log
          cargo check -p quiddity --release --locked --no-default-features --features presentation 2>&1 | tee ../validation-logs/quiddity-feature-off.log
      - name: Reuse unchanged API policy and audit evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The completed producer check already verified the earlier API/audit pass.
          # Only maintenance tooling, documentation and reviewed expectations changed.
          previous=184946bc4f0e2924f5c1fc370bcd62baf7387679
          git diff --name-only "$previous" HEAD > ../validation-logs/reused-scope.log
          if grep -Ev '^(CHANGELOG.md|CONTRIBUTING.md|docs/|crates/snapshot-tool/|tests/fixtures/rust-snapshot/)' ../validation-logs/reused-scope.log; then exit 1; fi
          endpoint=repos/xu9299/quiddity-rust/actions/jobs/132311204208
          conclusion=$(gh api "$endpoint" --jq '.steps[] | select(.name == "Reuse unchanged public API and dependency checks") | .conclusion')
          test "$conclusion" = success
          printf '%s\n' 'Reused API policy, semver and dependency audit from producer review 43550362331.' | tee ../validation-logs/reused-checks.log
      - name: Strict candidate snapshot reproduction
        run: |
          cargo run -p snapshot-tool --release --locked -- --check 2>&1 | tee ../validation-logs/strict.log
          grep -Fx 'HEAD reproduces all 2702 snapshots byte for byte' ../validation-logs/strict.log
          test -z "$(git status --porcelain)"
      - name: Complete workspace and corpus regression
        if: ${{ !cancelled() }}
        env:
          QUIDDITY_SNAPSHOT_VERIFY_DIR: ${{ github.workspace }}/validation-logs/verified
          RUST_BACKTRACE: full
        run: cargo test --workspace --release --locked 2>&1 | tee ../validation-logs/workspace.log
      - name: Snapshot coverage and provenance
        if: ${{ !cancelled() }}
        run: |
          cargo run -p snapshot-tool --release --locked -- --check --coverage-only --verify-dir ../validation-logs/verified 2>&1 | tee ../validation-logs/coverage.log
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nurbs-integral-final-evidence
          path: validation-logs/
          retention-days: 30

name: Parallel remaining performance validation

on:
  push:
    branches: [validation/performance-v050-20261112]
  workflow_dispatch:

permissions:
  contents: read

# Serialize retries of this branch without blocking unrelated validation workflows.
concurrency:
  group: independent-performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "6"
  RUST_TEST_THREADS: "6"
  RUSTUP_TOOLCHAIN: "1.99.1"
  QUIDDITY_CORPUS_REQUIRED: "1"
  QUIDDITY_CORPUS: ${{ github.workspace }}/quiddity-corpus
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

# Completed Windows and clean-baseline checks are retained in the checkpoint record.
jobs:
  topic:
    name: ARM ${{ matrix.topic }}
    runs-on: macos-26
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: [{"topic": "02-evidence-records", "head": "b4bfd78e365dc12cb4b7fd925613871a4171b7c3", "tree": "cbe02dafb06ee06513c9e2dcde7032086e75098d", "package": "quiddity", "tests": ["quiddity:document_record_serialization_matches_the_individual_accessor_bytes", "quiddity:shared_analysis_", "quiddity:unowned_recess_projection_errors_are_partial_not_silent_success", "quiddity:unowned_recess_controls_keep_independent_evidence_and_source_identity"]}, {"topic": "03-recess-discovery", "head": "cfaf1c18172742da534590bff66e426a8f382c93", "tree": "1c61a9081045bd843a57ea9dc3a019ad98835a51", "package": "quiddity", "tests": ["quiddity:section_recess_cache", "quiddity:shared_analysis_", "quiddity:unowned_recess_projection_errors_are_partial_not_silent_success", "quiddity:unowned_recess_controls_keep_independent_evidence_and_source_identity"]}, {"topic": "04-integral-operands", "head": "ee0896e6f9f33feac2b47d275700d90558bdbc2b", "tree": "e0477705dd6f1dad84f596263bb5418ae868066a", "package": "haecceity", "tests": ["haecceity:nurbs::tests::integral_evaluator", "haecceity:mass::tests::"]}, {"topic": "06-thread-scan", "head": "7e7ef0ddaaa12ff3c1c5d3591628c58a38c08ed3", "tree": "20a41e2545dbecfe548dcea7473bf872993d223d", "package": "quiddity", "tests": ["quiddity:modelled_threads::tests::"]}, {"topic": "07-volume-refusal", "head": "3281e40d0cc1fc7c9ad2b7d3311a2391707e878e", "tree": "ed3e86968504c3e1f55f6e58a2e5de7b8c3781f4", "package": "haecceity", "tests": ["haecceity:volume::tests::"]}]
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: xu9299/quiddity-rust
          ref: ${{ matrix.head }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: pzfreo/quiddity-corpus
          ref: 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
          path: quiddity-corpus
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: false
      - name: Record exact candidate and unchanged expectations
        run: |
          mkdir -p ../validation-logs/verified
          rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
          { git rev-parse HEAD; uname -a; sw_vers; rustc -vV; cargo -V; uv --version; } | tee ../validation-logs/environment.log
          test "$(uname -m)" = arm64
          # Reuse the strict baseline only on its verified OS, architecture and toolchain.
          test "$(sw_vers -productVersion)" = 26.7.2
          test "$(sw_vers -buildVersion)" = 25G332
          test "$(rustc -V)" = 'rustc 1.99.1 (58cf8f9c3 2026-10-13)'
          test "$(git -C ../quiddity-corpus rev-parse HEAD)" = 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
          test "$(git rev-parse HEAD)" = '${{ matrix.head }}'
          test "$(git rev-parse HEAD^{tree})" = '${{ matrix.tree }}'
          git diff --stat 18eefdc10c07dca3d1d0a3de19fe59e93713b9c6 HEAD | tee ../validation-logs/scope.log
          git diff --exit-code 18eefdc10c07dca3d1d0a3de19fe59e93713b9c6 HEAD -- Cargo.toml Cargo.lock crates/haecceity/Cargo.toml tests/fixtures
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: source -> ../target
          shared-key: independent-performance-v050-20261112-macos-26
      - name: Formatting and complete workspace lint
        run: |
          cargo fmt --all --check 2>&1 | tee ../validation-logs/fmt.log
          cargo clippy --workspace --all-targets --release --locked -- -D warnings 2>&1 | tee ../validation-logs/clippy.log
      - name: Supported feature-off builds
        run: |
          cargo check -p haecceity --release --locked --no-default-features 2>&1 | tee ../validation-logs/haecceity-feature-off.log
          cargo check -p quiddity --release --locked --no-default-features --features presentation 2>&1 | tee ../validation-logs/quiddity-feature-off.log
      - name: Upstream public API policy and dependency audit
        run: |
          cargo install cargo-semver-checks --version 0.51.0 --locked
          uv run --no-project --python 3.14 python -m unittest discover -s .github -p test_check_semver.py 2>&1 | tee ../validation-logs/semver-policy.log
          uv run --no-project --python 3.14 python .github/check_semver.py 2>&1 | tee ../validation-logs/semver.log
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file Cargo.lock 2>&1 | tee ../validation-logs/audit.log
      - name: Strict candidate snapshot reproduction
        id: strict
        run: |
          cargo run -p snapshot-tool --release --locked -- --check 2>&1 | tee ../validation-logs/strict.log
          grep -Fx 'HEAD reproduces all 2702 snapshots byte for byte' ../validation-logs/strict.log
          test -z "$(git status --porcelain)"
      - name: Complete workspace and corpus regression
        if: ${{ !cancelled() }}
        env:
          QUIDDITY_SNAPSHOT_VERIFY_DIR: ${{ github.workspace }}/validation-logs/verified
          RUST_BACKTRACE: full
        run: cargo test --workspace --release --locked 2>&1 | tee ../validation-logs/workspace.log
      - name: Produced snapshot coverage and provenance
        if: ${{ !cancelled() }}
        run: |
          cargo run -p snapshot-tool --release --locked -- --check --coverage-only --verify-dir ../validation-logs/verified 2>&1 | tee ../validation-logs/coverage.log
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: independent-performance-${{ matrix.topic }}
          path: validation-logs/
          retention-days: 30

name: Directed changed-fixture reader control

on:
  push:
    branches: [validation/centroid-pmi-export-054-20261119]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: centroid-pmi-export-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "6"
  RUST_TEST_THREADS: "6"
  RUSTUP_TOOLCHAIN: "1.99.1"
  QUIDDITY_CORPUS_REQUIRED: "1"
  QUIDDITY_CORPUS: ${{ github.workspace }}/quiddity-corpus
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  topic:
    name: ARM changed-fixture reader control only
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: xu9299/quiddity-rust
          ref: 7dd863e792da5e9954de984471d5957dab4fc7ca
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: pzfreo/quiddity
          ref: 847421798ef70f0d6a677999f5b4cb57522819e5
          path: upstream-baseline
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: pzfreo/quiddity-corpus
          ref: 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
          path: quiddity-corpus
          persist-credentials: false
      - name: Record fixed source and expected-input identity
        run: |
          mkdir -p ../pmi-logs
          rustup toolchain install 1.99.1 --profile minimal
          { git rev-parse HEAD; uname -a; sw_vers; rustc -vV; cargo -V; } | tee ../pmi-logs/environment.log
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = 7dd863e792da5e9954de984471d5957dab4fc7ca
          test "$(git rev-parse HEAD^{tree})" = 46a7345c20df204450f6195d74ed5cf3e64b7844
          test "$(git -C ../quiddity-corpus rev-parse HEAD)" = 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
          test -z "$(git status --porcelain)"
          test "$CI" = true
          git diff --stat ec91632b4120923cd5719095fb7ff1e8ba7c2257 HEAD | tee ../pmi-logs/source-scope.log
          git diff --exit-code ec91632b4120923cd5719095fb7ff1e8ba7c2257 HEAD -- Cargo.toml Cargo.lock crates/haecceity/src crates/haecceity/tests src tests/fixtures/rust-snapshot
          shasum -a 256 tests/fixtures/ap242/write-presentation/assembly_plate_pin_intent.step.gz tests/fixtures/ap242/write-presentation/assembly_plate_pin_intent.occt.json.gz | tee ../pmi-logs/input-sha256.log
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            source -> ../target
            upstream-baseline -> ../target-upstream-baseline
          shared-key: boundary-centroid-main-v054-20261119-macos-26
          cache-on-failure: true
      # The official exporter already passed in run 44453114337. Reuse its verified bytes.
      - name: Check the existing reader test consuming the changed fixture
        run: |
          cargo test -p haecceity --lib --release --locked step::tests::pmi_writer_shares_one_geometry_parse_between_parts -- --exact --nocapture 2>&1 | tee ../pmi-logs/reader-control.log
          grep -F '1 passed; 0 failed' ../pmi-logs/reader-control.log
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: centroid-pmi-reader-control-054
          path: pmi-logs
          if-no-files-found: error
